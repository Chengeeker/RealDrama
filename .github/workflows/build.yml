name: Build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'ndk;28.2.13676358' 'cmake;3.22.1' 'build-tools;36.0.0'
      - run: go test ./sourcevm ./internal/cryptoutil
        working-directory: native
      - run: go test ./core -run '^Test(Subscription(HeaderPolicy|RegistrationBoundary)|CanceledSubscriptionPrefetchRetainsPlayback)$'
        working-directory: native
      - run: python3 compose/tools/prepare_native.py
      - name: Configure manual build signing
        if: github.event_name == 'workflow_dispatch'
        run: python3 compose/tools/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: bash ./gradlew :app:assembleRelease :app:testDebugUnitTest -PuiAudit
        working-directory: compose
      - name: Verify release certificate
        if: github.event_name == 'workflow_dispatch' && hashFiles('compose/key.properties') != ''
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs compose/app/build/outputs/apk/release/app-release.apk |
            grep -Fx 'Signer #1 certificate SHA-256 digest: 3eb0f6708904f8ef916c6a2572e394ba981ee25d64861344cf1921ca7ea17975'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && hashFiles('compose/key.properties') != ''
        with:
          name: RealDrama-arm64-v8a
          path: compose/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove signing files
        if: always() && github.event_name == 'workflow_dispatch'
        run: python3 compose/tools/configure_signing.py --clean
